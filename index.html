(function () {

      + '<p style="margin-bottom:0"><button class="lnk" id="sw">' + (up ? p('Already have an account? Sign in', 'অ্যাকাউন্ট আছে? সাইন ইন', l) : p('New here? Register', 'নতুন? নিবন্ধন করুন', l)) + '</button>' + (up ? '' : ' &nbsp;·&nbsp; <button class="lnk" id="fp">' + p('Forgot password?', 'পাসওয়ার্ড ভুলে গেছেন?', l) + '</button>') + '</p></div>';
  };

  if (!hint) { document.getElementById('app').innerHTML = window.__authHTML(false, lang); window.__staticLogin = true; }

/* ============ data ============ */
const mref = () => doc(db, 'members', user.uid);
async function load() {
  const q = c => getDocs(query(collection(db, c), where('month', '==', month))).then(s => s.docs.map(d => Object.assign({ id: d.id }, d.data())));
  const mp = getDocs(collection(db, 'members')).then(ms => ms.docs.map(d => Object.assign({ id: d.id }, d.data())));
  [S.members, S.meals, S.bazar, S.costs] = await Promise.all([mp].concat(['meals', 'bazar', 'costs'].map(q)));
}
const actives = () => S.members.filter(m => m.status === 'active').sort((a, b) => (a.name || '').localeCompare(b.name || ''));
const nameOf = id => { const m = S.members.find(x => x.id === id); return m ? m.name : '?'; };
const mv = x => x.n != null ? (+x.n || 0) : (+x.b || 0) + (+x.l || 0) + (+x.d || 0);
function calc() {
  const ms = actives(), meals = {}, paid = {}; ms.forEach(m => { meals[m.id] = 0; paid[m.id] = 0; });
  S.meals.forEach(x => { if (x.uid in meals) meals[x.uid] += mv(x); });
  S.bazar.forEach(x => { if (x.uid in paid) paid[x.uid] += +x.amount || 0; });
  const totM = sum(Object.values(meals), v => v), bz = sum(S.bazar, x => x.amount), oc = sum(S.costs, x => x.amount);
  const rate = totM ? bz / totM : 0, share = ms.length ? oc / ms.length : 0;
  const rows = ms.map(m => { const cost = meals[m.id] * rate; return { m, meals: meals[m.id], cost, paid: paid[m.id], share, bal: paid[m.id] - cost - share }; });
  return { rows, totM, bz, oc, rate, share };
}

const loadJs = s => new Promise((res, rej) => { const e = document.createElement('script'); e.src = s; e.onload = res; e.onerror = () => rej(new Error('Could not load ' + s)); document.head.appendChild(e); });
const RCSS = '.rp{width:794px;height:1123px;position:relative;background:#fff;color:#1b2430;font-family:"Noto Sans Bengali",Arial,sans-serif;font-size:13px;line-height:1.5;overflow:hidden;box-sizing:border-box}.rp *{box-sizing:border-box}'
  + '.rh{position:absolute;left:40px;right:40px;top:30px;height:82px;border-bottom:3px solid #c9a227;display:flex;justify-content:space-between;align-items:flex-start}.rh .a b{display:block;font-size:23px;color:#1f4e79;line-height:1.35}.rh .a span{font-size:15px;font-weight:600}.rh .c{text-align:right;font-size:12px;color:#5d6b7a;line-height:1.6}.rh .c b{font-size:14px;color:#1b2430}'
  + '.rb{position:absolute;left:40px;right:40px;top:128px;bottom:80px;overflow:hidden}.rf{position:absolute;left:40px;right:40px;bottom:26px;height:36px;border-top:1px solid #c8d0da;display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;color:#5d6b7a}.rf b{color:#1f4e79}'
  + '.rb h3{margin:14px 0 6px;font-size:14px;color:#000}.rb table{width:100%;border-collapse:collapse;font-size:12.5px}.rb th,.rb td{border:1px solid #000;padding:4px 7px;color:#000;background:none;vertical-align:top}.rb th{font-weight:700;text-align:left}.rb .n{text-align:right}.rb tr.tot td{font-weight:700}.rb table.x1{font-size:10.5px}.rb table.x2{font-size:9px}.rb table.x1 th,.rb table.x1 td,.rb table.x2 th,.rb table.x2 td{padding:3px 4px}.rb .nt{margin-top:12px;font-size:11.5px;color:#444}';
const monthLabel = m => { const a = m.split('-'); return new Date(+a[0], +a[1] - 1, 1).toLocaleDateString(lang === 'bn' ? 'bn-BD' : 'en-GB', { month: 'long', year: 'numeric' }); };

async function makePdf(title, blocks, file, period) {
  if (!window.html2canvas) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if (!window.jspdf) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  try { await Promise.all(['400', '600', '700'].map(w => document.fonts.load(w + ' 14px "Noto Sans Bengali"', 'অআকখ'))); await document.fonts.ready; } catch (e) {}
  const root = document.createElement('div'); root.id = 'rroot'; root.style.cssText = 'position:absolute;left:-10000px;top:0;width:794px'; root.innerHTML = '<style>' + RCSS + '</style>'; document.body.appendChild(root);
  const gen = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const pages = []; let body = null;
  const newPage = () => {
    const pg = document.createElement('div'); pg.className = 'rp';
    pg.innerHTML = '<div class="rh"><div class="a"><b>' + p('Meal Manager', 'মিল ম্যানেজার') + '</b><span>' + esc(title) + '</span></div><div class="c"><b>' + esc(period || monthLabel(month)) + '</b><br>' + p('Generated', 'তৈরির তারিখ') + ': ' + gen + '</div></div><div class="rb"></div>'
      + '<div class="rf"><span>Meal Manager</span><span>Developed by <b>Farhan Tanzid Shiyam</b></span><span class="pn"></span></div>';
    root.appendChild(pg); pages.push(pg); body = pg.querySelector('.rb'); return body;
  };
  const over = () => body.scrollHeight > body.clientHeight + 1;
  newPage();
  blocks.forEach(b => {
    if (b.type === 'pagebreak') { newPage(); return; }
    if (b.type === 'stats') { const d = document.createElement('div'); d.className = 'st'; d.innerHTML = b.items.map(i => '<div><small>' + esc(i[0]) + '</small><b>' + esc(i[1]) + '</b></div>').join(''); body.appendChild(d); }
    else if (b.type === 'note') { const d = document.createElement('div'); d.className = 'nt'; d.textContent = b.text; if (body.appendChild(d), over()) { body.removeChild(d); newPage().appendChild(d); } }
    else if (b.type === 'table') {
      const mk = cont => { const w = document.createElement('div'); if (b.title) { const h = document.createElement('h3'); h.textContent = b.title + (cont ? ' (' + p('continued', 'চলমান') + ')' : ''); w.appendChild(h); } const t = document.createElement('table'); t.className = b.cols.length > 10 ? 'x2' : b.cols.length > 7 ? 'x1' : ''; t.innerHTML = '<thead><tr>' + b.cols.map(c => '<th class="' + (c.n ? 'n' : '') + '">' + esc(c.h) + '</th>').join('') + '</tr></thead><tbody></tbody>'; w.appendChild(t); return w; };
      let w = mk(false), tb; const start = () => { body.appendChild(w); tb = w.querySelector('tbody'); }; start();
      const add = (cells, tot) => { const tr = document.createElement('tr'); if (tot) tr.className = 'tot'; tr.innerHTML = cells.map((c, i) => { const o = (c && typeof c === 'object') ? c : { t: c }; return '<td class="' + ((b.cols[i] && b.cols[i].n ? 'n ' : '') + (o.c || '')) + '">' + esc(o.t) + '</td>'; }).join(''); tb.appendChild(tr); return tr; };
      const all = b.rows.map(r => [r, 0]); if (b.foot) all.push([b.foot, 1]);
      all.forEach(a => {
        let tr = add(a[0], a[1]);
        if (over()) {
          if (tb.children.length === 1) { body.removeChild(w); newPage(); w = mk(false); start(); add(a[0], a[1]); }
          else { tb.removeChild(tr); newPage(); w = mk(true); start(); add(a[0], a[1]); }
        }
      });
    }
  });
  pages.forEach((pg, i) => { pg.querySelector('.pn').textContent = p('Page', 'পৃষ্ঠা') + ' ' + (i + 1) + ' / ' + pages.length; });
  try {
    const jsPDF = window.jspdf.jsPDF, pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    for (let i = 0; i < pages.length; i++) {
      const cv = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0, onclone: d => { const r = d.getElementById('rroot'); if (r) { r.style.left = '0'; } } });
      if (i) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    pdf.save(file);
  } finally { root.remove(); }
}
async function exportPdf() {
  const kind = ($('#pk') || {}).value || 'month', L = p('Total', 'মোট'), blocks = [], ms = actives(), c = calc();
  const pad0 = (a, n) => { while (a.length < n) a.push(''); return a; };
  const kv = (title, rows) => ({ type: 'table', title, cols: [{ h: p('Item', 'বিষয়') }, { h: p('Value', 'মান'), n: 1 }], rows });
  const bazarTbl = (list, title) => ({ type: 'table', title, cols: [{ h: p('Date', 'তারিখ') }, { h: p('Bought by', 'কে বাজার করেছেন') }, { h: p('Item / note', 'বিবরণ') }, { h: p('Amount', 'টাকা'), n: 1 }], rows: list.length ? list.map(x => [x.date, nameOf(x.uid), x.note || '', money(x.amount)]) : [pad0([p('No bazar', 'কোনো বাজার নেই')], 4)], foot: ['', '', L, money(sum(list, x => x.amount))] });
  const costTbl = (list, title) => ({ type: 'table', title, cols: [{ h: p('Date', 'তারিখ') }, { h: p('Title', 'খাত') }, { h: p('Amount', 'টাকা'), n: 1 }], rows: list.length ? list.map(x => [x.date, x.note || '', money(x.amount)]) : [pad0([p('No other costs', 'কোনো খরচ নেই')], 3)], foot: ['', L, money(sum(list, x => x.amount))] });
  const byDate = (a, b) => a.date.localeCompare(b.date);
  if (kind === 'day') {
    const d = ($('#pd') || {}).value;
    if (!d || d.slice(0, 7) !== month) throw new Error(p('Pick a date inside the selected month.', 'নির্বাচিত মাসের ভেতরের একটি তারিখ দিন।'));
    const ml = S.meals.filter(x => x.date === d), bz = S.bazar.filter(x => x.date === d), oc = S.costs.filter(x => x.date === d);
    const per = ms.map(m => sum(ml.filter(x => x.uid === m.id), mv));
    blocks.push(kv(p('Day summary', 'দিনের সারসংক্ষেপ'), [[p('Date', 'তারিখ'), d], [p('Total meals', 'মোট মিল'), money(sum(per, v => v))], [p('Bazar', 'বাজার'), money(sum(bz, x => x.amount))], [p('Other costs', 'অন্যান্য খরচ'), money(sum(oc, x => x.amount))]]));
    blocks.push({ type: 'table', title: p('Meals', 'মিল'), cols: [{ h: p('Member', 'সদস্য') }, { h: p('Meals', 'মিল'), n: 1 }], rows: ms.length ? ms.map((m, i) => [m.name, per[i] ? money(per[i]) : '-']) : [['-', '']], foot: [L, money(sum(per, v => v))] });
    blocks.push(bazarTbl(bz.slice().sort(byDate), p('Bazar details', 'বাজারের বিবরণ')));
    blocks.push(costTbl(oc.slice().sort(byDate), p('Other costs', 'অন্যান্য খরচ')));
    await makePdf(p('Day-wise report', 'দিনভিত্তিক রিপোর্ট'), blocks, 'Meal-day-' + d + '.pdf', d);
    return;
  }
  blocks.push(kv(p('Summary', 'সারসংক্ষেপ'), [[p('Active members', 'সক্রিয় সদস্য'), String(ms.length)], [p('Total bazar', 'মোট বাজার'), money(c.bz)], [p('Total meals', 'মোট মিল'), money(c.totM)], [p('Meal rate', 'মিল রেট'), money(c.rate)], [p('Other costs', 'অন্যান্য খরচ'), money(c.oc)], [p('Other cost share per member', 'প্রতি সদস্যের অন্য খরচের ভাগ'), money(c.share)]]));
  const dates = Array.from(new Set(S.meals.map(x => x.date))).sort();
  const cols = [{ h: p('Date', 'তারিখ') }].concat(ms.map(m => ({ h: m.name, n: 1 })), [{ h: L, n: 1 }]), tot = ms.map(() => 0);
  const rows = dates.map(d => { let t = 0; const r = [d]; ms.forEach((m, i) => { const v = sum(S.meals.filter(x => x.date === d && x.uid === m.id), mv); t += v; tot[i] += v; r.push(v ? money(v) : '-'); }); r.push(money(t)); return r; });
  blocks.push({ type: 'table', title: p('Day-wise meals', 'দিনভিত্তিক মিল'), cols, rows: rows.length ? rows : [pad0([p('No meals recorded', 'কোনো মিল নেই')], cols.length)], foot: [L].concat(tot.map(money), [money(sum(tot, v => v))]) });
  blocks.push(bazarTbl(S.bazar.slice().sort(byDate), p('Bazar details', 'বাজারের বিবরণ')));
  blocks.push(costTbl(S.costs.slice().sort(byDate), p('Other costs', 'অন্যান্য খরচ')));
  blocks.push({ type: 'pagebreak' });
  blocks.push({ type: 'table', title: p('Member-wise summary', 'সদস্যভিত্তিক হিসাব'), cols: [{ h: p('Member', 'সদস্য') }, { h: p('Meals', 'মিল'), n: 1 }, { h: p('Meal cost', 'মিল খরচ'), n: 1 }, { h: p('Other share', 'অন্য খরচের ভাগ'), n: 1 }, { h: p('Bazar paid', 'বাজারে খরচ'), n: 1 }, { h: p('Balance', 'ব্যালেন্স'), n: 1 }],
    rows: c.rows.length ? c.rows.map(r => [r.m.name, money(r.meals), money(r.cost), money(r.share), money(r.paid), money(r.bal)]) : [pad0([p('No active members', 'কোনো সক্রিয় সদস্য নেই')], 6)],
    foot: [L, money(sum(c.rows, r => r.meals)), money(sum(c.rows, r => r.cost)), money(sum(c.rows, r => r.share)), money(sum(c.rows, r => r.paid)), money(sum(c.rows, r => r.bal))] });
  blocks.push({ type: 'note', text: p('Meal rate = total bazar ÷ total meals. Balance = bazar paid − meal cost − other share. Positive = gets back, negative = must pay.', 'মিল রেট = মোট বাজার ÷ মোট মিল। ব্যালেন্স = বাজারে খরচ − মিল খরচ − অন্য খরচের ভাগ। ধনাত্মক = ফেরত পাবে, ঋণাত্মক = দিতে হবে।') });
  await makePdf(p('Monthly report', 'মাসিক রিপোর্ট'), blocks, 'Meal-month-' + month + '.pdf', monthLabel(month));
}
