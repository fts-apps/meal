(function () {
  var shown = 0, tgt = 0, tm = null, c = 0, lg = 'bn';

  };

  else {
    /* returning user: paint the last screen (saved HTML) right now, before Firebase has even downloaded */
    try {
      var sn = JSON.parse(localStorage.getItem('mm_s') || 'null'), seg = location.pathname.split('/').filter(Boolean).pop() || '', t0 = '';

async function load() {
  const q = c => getDocs(query(collection(db, c), where('month', '==', month))).then(s => s.docs.map(d => Object.assign({ id: d.id }, d.data())));
  const mp = getDocs(collection(db, 'members')).then(ms => ms.docs.map(d => Object.assign({ id: d.id }, d.data())));
  [S.members, S.meals, S.bazar, S.costs] = await Promise.all([mp].concat(['meals', 'bazar', 'costs'].map(q)));
}
const actives = () => S.members.filter(m => m.status === 'active').sort((a, b) => (a.name || '').localeCompare(b.name || ''));
const nameOf = id => { const m = S.members.find(x => x.id === id); return m ? m.name : '?'; };
const mv = x => x.n != null ? (+x.n || 0) : (+x.b || 0) + (+x.l || 0) + (+x.d || 0);
function calc() {
  const ms = actives(), meals = {}, paid = {}; ms.forEach(m => { meals[m.id] = 0; paid[m.id] = 0; });
  S.meals.forEach(x => { if (x.uid in meals) meals[x.uid] += mv(x); });
  S.bazar.forEach(x => { if (x.uid in paid) paid[x.uid] += +x.amount || 0; });
  const totM = sum(Object.values(meals), v => v), bz = sum(S.bazar, x => x.amount), oc = sum(S.costs, x => x.amount);
  const rate = totM ? bz / totM : 0, share = ms.length ? oc / ms.length : 0;
  const rows = ms.map(m => { const cost = meals[m.id] * rate; return { m, meals: meals[m.id], cost, paid: paid[m.id], share, bal: paid[m.id] - cost - share }; });
  return { rows, totM, bz, oc, rate, share };
}

  let qrText = rep.facts.join('\n'), online = false, warn = '';
  const base = viewBase();
  if (!base) warn = p('The QR holds plain text because this page is not opened from your website (https).', 'এই পেজ ওয়েবসাইট (https) থেকে খোলা নয়, তাই QR-এ লিংকের বদলে লেখা আকারে হিসাব আছে।');
  else {
    const key = rep.id + '-' + token();
    try {
      await Promise.race([
        setDoc(doc(db, 'reports', key), { kind, month, date: kind === 'day' ? d : '', rid: rep.id, lang, by: user.uid, name: (me && me.name) || '', genT, createdAt: serverTimestamp(), data: snapData(kind, d) }),
        new Promise((_, rj) => setTimeout(() => rj(new Error('timeout')), 8000))
      ]);
      qrText = base + '?r=' + key; online = true;
    } catch (e) {
      warn = (e && e.code === 'permission-denied')
        ? p('PDF is ready, but the online view is not active: add the "reports" rule in Firestore Rules. The QR holds plain text for now.', 'PDF তৈরি হয়েছে, কিন্তু অনলাইন ভিউ চালু নেই: Firestore Rules-এ "reports" রুলটি যোগ করুন। আপাতত QR-এ লেখা আকারে হিসাব আছে।')
        : p('PDF is ready, but the online copy could not be saved (check internet). The QR holds plain text.', 'PDF তৈরি হয়েছে, কিন্তু অনলাইন কপি সেভ হয়নি (ইন্টারনেট দেখুন)। QR-এ লেখা আকারে হিসাব আছে।');
    }
  }
  await makePdf(rep.title, rep.items, rep.file, rep.period, { id: rep.id, qrText, qrUrl: online, online });
  loadReports();
  if (warn) alert(warn);
}

/* ============ public report page: opened by scanning the QR (?r=KEY), no login ============ */
const VCSS = '.vwrap{max-width:900px;margin:0 auto}.vwrap .vt{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}'
  + '.rp.vw{width:auto;height:auto;overflow:hidden;padding:0 0 20px;border:1px solid #d1d5db;border-radius:6px}.vw .vh{background:#fff;color:#111827;border-bottom:2px solid #111827;padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}'
  + '.vw .vh small{display:block;font-size:13px;color:#6b7280;font-weight:600}.vw .vh b{display:block;font-size:22px;line-height:1.35}.vw .vh .vr{text-align:right;font-size:13px;line-height:1.65;color:#6b7280}.vw .vh .vr b{font-size:16px;color:#111827}'
  + '.vw .vc{padding:0 20px}.vw .sc{overflow-x:auto}.vw .t{min-width:600px}.vw .kt{min-width:0}'
  + '@media(max-width:600px){.vw .tiles{grid-template-columns:1fr 1fr}.vw .vh .vr{text-align:left}.vw .vc{padding:0 12px}}';
async function showReport(key) {
  document.body.classList.remove('in'); $('#side').innerHTML = '';
  const msg = (h, t) => { app.innerHTML = '<div class="card center"><h2>' + esc(h) + '</h2><p class="muted">' + esc(t) + '</p></div>'; };
  if (!/^[A-Za-z0-9_-]{8,80}$/.test(key)) return msg(p('Report not found', 'রিপোর্ট পাওয়া যায়নি'), p('This link is not valid.', 'এই লিংকটি সঠিক নয়।'));
  ld(30);
  let snap;
  try {
    const s = await getDoc(doc(db, 'reports', key));
    if (!s.exists()) return msg(p('Report not found', 'রিপোর্ট পাওয়া যায়নি'), p('This report does not exist or was removed.', 'এই রিপোর্টটি নেই বা মুছে ফেলা হয়েছে।'));
    snap = s.data();
  } catch (e) {
    return msg(p('Cannot open report', 'রিপোর্ট খোলা যায়নি'), e && e.code === 'permission-denied' ? p('Online view is not enabled. The manager must add the "reports" rule in Firestore.', 'অনলাইন ভিউ চালু নেই। ম্যানেজারকে Firestore-এ "reports" রুল যোগ করতে হবে।') : emsg(e));
  }
  lang = snap.lang === 'en' ? 'en' : 'bn'; S = snap.data; month = snap.month; me = { name: snap.name }; user = { email: '' };
  const draw = () => {
    const rep = buildReport(snap.kind, snap.date, snap.genT); let n = 0;
    const body = rep.items.map(b => {
      if (b.type === 'info') return kvT(b.items);
      if (b.type === 'note') return '<div class="note">' + esc(b.text) + '</div>';
      if (b.type === 'verify' || b.type === 'pagebreak') return '';
      n++;
      if (b.type === 'tiles') return headH(b.title, n) + '<div class="tiles">' + b.items.map(i => '<div class="tile"><small>' + esc(i[0]) + '</small><b>' + esc(i[1]) + '</b></div>').join('') + '</div>';
      if (b.type === 'kv') return headH(b.title, n) + kvT(b.items);
      return headH(b.title, n) + tblH(b);
    }).join('');
    const base = viewBase();
    app.innerHTML = '<div class="vwrap"><style>' + RCSS + VCSS + '</style><div class="vt"><button class="btn btn-sm" id="vl">' + (lang === 'bn' ? 'English' : 'বাংলা') + '</button>' + (base ? '<a class="btn btn-sm" href="' + esc(base) + '">' + p('Open Meal Manager', 'মিল ম্যানেজার খুলুন') + '</a>' : '') + '</div>'
      + '<div class="rp vw' + (lang === 'en' ? ' en' : '') + '"><div class="vh"><div><small>' + p('Meal Manager', 'মিল ম্যানেজার') + '</small><b>' + esc(rep.title) + '</b></div><div class="vr"><b>' + esc(rep.period) + '</b>' + esc(rep.id) + '<br>' + p('Generated', 'তৈরির সময়') + ': ' + esc(snap.genT || '') + '</div></div>'
      + '<div class="vc">' + body + '</div></div></div>';
    document.title = rep.title + ' - Meal Manager'; $('#vl').onclick = () => { lang = lang === 'bn' ? 'en' : 'bn'; draw(); };
  };
  draw();
}

/* instant screen from the last visit (refreshed quietly in the background) */
let CACHE = null, PRE = null;
function saveCache() { try { if (user && me && month === nowM()) localStorage.setItem('mm_c', JSON.stringify({ uid: user.uid, email: user.email, me, isAdmin, S, month })); } catch (e) {} }
(function earlyCache() {
  if (VID) return;
  try {
    const h = localStorage.getItem('mm_hint'), c = JSON.parse(localStorage.getItem('mm_c') || 'null');
    if (!h || h === '1' || !c || c.uid !== h || c.month !== nowM() || !c.me || !(c.isAdmin || c.me.status === 'active')) return;
    CACHE = c; user = { uid: c.uid, email: c.email }; me = c.me; isAdmin = c.isAdmin; S = c.S; month = c.month;
    let t0 = ''; try { t0 = sessionStorage.getItem('mm_tab') || ''; sessionStorage.removeItem('mm_tab'); } catch (e) {}
    tab = t0 || lastSeg; if (!TABS[tab]) tab = 'dash'; setUrl();
    document.body.classList.add('in'); renderSide(); renderTab();
  } catch (e) { CACHE = null; }
})();

if (!CACHE && !window.__snap && !VID) ld(12);
if (VID) showReport(VID); else onAuthStateChanged(auth, async u => {
  const quiet = !!(CACHE && u && CACHE.uid === u.uid);
  user = u; me = null; isAdmin = false;
  try { if (u) localStorage.setItem('mm_hint', u.uid); else { localStorage.removeItem('mm_hint'); localStorage.removeItem('mm_c'); localStorage.removeItem('mm_s'); } } catch (e) {}
  if (!u) { CACHE = null; document.body.classList.remove('in'); $('#side').innerHTML = ''; return authScreen('in'); }
  if (!quiet) ld(35);
  const pMe = getDoc(mref()); pMe.catch(() => {});
  PRE = load(); PRE.catch(() => {});
  isAdmin = await getDoc(doc(db, 'admins', u.uid)).then(() => true, () => false);   // rules allow this read only for the manager UID
  try {
    let s = await pMe;
    if (!s.exists()) { await setDoc(mref(), { name: pendingName || u.displayName || (u.email || '').split('@')[0], email: u.email || '', role: isAdmin ? 'admin' : 'member', status: isAdmin ? 'active' : 'pending', createdAt: serverTimestamp() }); s = await getDoc(mref()); }
    me = s.data();
  } catch (e) { console.warn(e); app.innerHTML = '<div class="card center"><p class="msg">' + esc(emsg(e)) + '</p><div class="uid">' + esc(u.uid) + '</div><button class="btn" data-a="logout">' + p('Sign out', 'সাইন আউট') + '</button></div>'; return; }
  if (!quiet) ld(60);
  if (!isAdmin && me.status !== 'active') { try { localStorage.removeItem('mm_c'); localStorage.removeItem('mm_s'); } catch (e) {} CACHE = null; return waitScreen(); }
  if (quiet) {
    try { const pr = PRE; PRE = null; await (pr ? pr.catch(() => load()) : load()); saveCache(); } catch (e) { console.warn(e); return; }
    const a = document.activeElement;
    if (!(a && app.contains(a) && /^(INPUT|SELECT)$/.test(a.tagName))) { renderSide(); renderTab(); }
    return;
  }
  let t0 = ''; try { t0 = sessionStorage.getItem('mm_tab') || ''; sessionStorage.removeItem('mm_tab'); } catch (e) {}
  tab = t0 || lastSeg; if (!TABS[tab]) tab = 'dash'; setUrl();
  await refresh();
});
</script>
