<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meal Manager</title>
<script>
/* Static hosts (GitHub Pages) serve this file for /app/meals etc. Send the visitor back to the app root and remember the tab. */
(function () {
  var tabs = ['meals', 'bazar', 'costs', 'members', 'pdf', 'account'];
  var parts = location.pathname.replace(/\/+$/, '').split('/'), last = parts.pop();
  if (tabs.indexOf(last) > -1) {
    try { sessionStorage.setItem('mm_tab', last); } catch (e) {}
    location.replace(parts.join('/') + '/');
  }
})();
</script>
